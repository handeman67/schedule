<body>
<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="side-note"><strong>Stephen Campbell Building</strong><span>Plan · Track · Get it done</span></div>
    <nav class="side-nav-list" id="sideNav"></nav>
    <div class="side-foot"><strong>Quality work</strong>You can count on.<br>928-297-8814</div>
  </aside>
  <main class="main"><div id="app"></div></main>
  <nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"></nav>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(() => {
  "use strict";
  const STATUS={scheduled:"Scheduled",in_progress:"In progress",completed:"Completed",cancelled:"Cancelled"};
  const nav=[['dashboard','grid','Dashboard'],['new','plus','Add job'],['customers','users','Customers'],['calendar','calendar','Calendar'],['notes','note','Notes'],['guide','info','How it works']];
  const icons={
    grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M16 3v4M8 3v4M3 10h18"/>',note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6"/>',camera:'<path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3z"/><circle cx="12" cy="13" r="3"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'
  };
  const icon=n=>`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24">${icons[n]||icons.info}</svg>`;
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const storageKey='stephen-campbell-scheduler-autosave';
  const state={view:'dashboard',selected:null,query:'',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),dirty:false,data:{version:1,businessNotes:'',customers:[],jobs:[],photos:[]},editingCustomer:false,editingJob:null,showJobForm:false,confirmDelete:false,confirmJob:null};
  if(window.location.hash==='#newForm')state.view='new';
  const app=document.getElementById('app');
  const uid=()=>Date.now()+Math.floor(Math.random()*100000);
  const dateLabel=(d,short=false)=>{if(!d)return 'Not scheduled';const x=new Date(d+'T12:00:00');return x.toLocaleDateString(undefined,short?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'})};
  const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(Number(n||0));
  function saveLocal(){try{localStorage.setItem(storageKey,JSON.stringify(state.data))}catch{}}
  function restoreLocal(){try{const d=JSON.parse(localStorage.getItem(storageKey)||'null');if(Array.isArray(d?.customers)&&Array.isArray(d?.jobs)&&Array.isArray(d?.photos)){state.data={version:1,businessNotes:String(d.businessNotes||''),customers:d.customers,jobs:d.jobs,photos:d.photos};return true}}catch{}return false}
  const setDirty=()=>{state.dirty=true;saveLocal()};
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2200)}
  function status(s){return `<span class="status ${s}">${esc(STATUS[s]||s)}</span>`}
  function empty(ic,title,text,action=''){return `<div class="empty">${icon(ic)}<h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`}

  function dashboard(){const jobs=state.data.jobs;const counts=[['Total jobs',jobs.length,'blue'],['Scheduled',jobs.filter(j=>j.status==='scheduled').length,'green'],['In progress',jobs.filter(j=>j.status==='in_progress').length,'gold'],['Completed',jobs.filter(j=>j.status==='completed').length,'steel']];const today=new Date();today.setHours(0,0,0,0);const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;const upcoming=jobs.filter(j=>j.status!=='cancelled'&&j.scheduledDate&&j.scheduledDate>=todayStr).sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate)).slice(0,6);return `<div class="page"><header class="page-intro"><div><span class="eyebrow">Business scheduler</span><h1>Today’s work</h1><p>Customers, jobs, and the calendar stay in step.</p></div><button class="primary" data-go="new">${icon('plus')}Add customer / job</button></header><div class="metrics">${counts.map(x=>`<div class="metric ${x[2]}"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><section class="panel schedule-panel">${sectionHead('Upcoming scheduled jobs','The next dates on your calendar','<button class="text-btn" data-go="calendar">View calendar '+icon('right')+'</button>')}${upcoming.length?`<div class="job-rows">${upcoming.map(j=>`<button class="job-row" data-open="${j.customerId}"><time>${dateLabel(j.scheduledDate,true)}</time><span class="job-main"><strong>${esc(customer(j.customerId)?.name||'Customer')}</strong><small>${esc(j.title)}</small></span>${status(j.status)}</button>`).join('')}</div>`:empty('calendar','No upcoming jobs yet','Add a customer and job to start filling the schedule.','<button class="secondary" data-go="new">Add first job</button>')}</section></div>`}
  function newForm(){return `<div class="page"><header class="page-intro compact"><div><span class="eyebrow">New work</span><h1>Add a customer and job</h1><p>One form creates the customer record and puts the job on the calendar.</p></div></header><div class="panel" style="padding:13px;margin-bottom:16px"><strong style="display:block;margin-bottom:6px">Have a completed customer form?</strong><p style="margin:0 0 10px;color:var(--muted);font-size:13px">Send new customers <a href="customer-intake-form.html" target="_blank" rel="noopener">this intake form link</a>. When they email the completed file back, upload it here to fill in the fields below automatically.</p><label class="secondary small" style="display:inline-flex;cursor:pointer">${icon('upload')}Upload completed form<input id="intakeUpload" type="file" accept="application/json,.json" class="sr-only"></label></div><form id="newForm" class="form-page"><section class="form-section"><h2>Customer information</h2><div class="field-grid"><label class="wide">Customer name<input name="name" required autocomplete="name"></label><label>Phone<input name="phone" autocomplete="tel" inputmode="tel"></label><label>Email<input name="email" type="email" autocomplete="email"></label><label class="wide">Address<input name="address" autocomplete="street-address"></label></div></section><section class="form-section"><h2>Job / project details</h2><div class="field-grid"><label class="wide">Job or project title<input name="title" required></label><label class="wide">Description<textarea name="description" rows="4"></textarea></label><label class="wide">Materials / special instructions<textarea name="materials" rows="3"></textarea></label><label>Estimate ($)<input name="estimate" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label><label>Scheduled date<input name="scheduledDate" type="date"></label><label>Job status<select name="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</optio   function bindNew(){document.getElementById('newForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),cid=uid(),jid=uid()+1;state.data.customers.push({id:cid,name:String(f.get('name')).trim(),phone:String(f.get('phone')).trim(),email:String(f.get('email')).trim(),address:String(f.get('address')).trim()});state.data.jobs.push({id:jid,customerId:cid,title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),materials:String(f.get('materials')).trim(),estimate:Number(f.get('estimate')||0),scheduledDate:String(f.get('scheduledDate')||''),status:String(f.get('status'))});setDirty();toast('Customer and job added');openCustomer(cid)};document.getElementById('intakeUpload').onchange=loadIntakeForm}
  function loadIntakeForm(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result));const c=d.customer||{},j=d.job||{};const form=document.getElementById('newForm');form.name.value=c.name||'';form.phone.value=c.phone||'';form.email.value=c.email||'';form.address.value=c.address||'';form.title.value=j.title||'';form.description.value=j.description||'';form.materials.value=j.materials||'';if(j.preferredDate)form.scheduledDate.value=j.preferredDate;toast('Customer form loaded — review and save')}catch{toast('That file is not a valid customer intake form')}};r.readAsText(file);e.target.value=''}
  function customers(){const q=state.query.toLowerCase();const list=state.data.customers.filter(c=>`${c.name} ${c.phone} ${c.address}`.toLowerCase().includes(q));return `<div class="page"><header class="page-intro compact"><div><span class="eyebrow">Customer database</span><h1>Customers and jobs</h1><p>${state.data.customers.length} customer${state.data.customers.length===1?'':'s'} · ${state.data.jobs.length} job${state.data.jobs.length===1?'':'s'}</p></div><button class="primary" data-go="new">${icon('plus')}Add new</button></header><label class="search">${icon('search')}<span class="sr-only">Search customers</span><input id="searchInput" value="${esc(state.query)}" placeholder="Search name, phone, or address"></label>${list.length?`<div class="customer-list">${list.map(c=>{const jobs=jobsFor(c.id);const next=jobs.filter(j=>j.status!=='completed'&&j.status!=='cancelled'&&j.scheduledDate).sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate))[0];return `<button class="customer-card" data-open="${c.id}"><span class="customer-id">${String(state.data.customers.indexOf(c)+1).padStart(3,'0')}</span><span class="customer-summary"><strong>${esc(c.name)}</strong><small>${esc(c.phone||'No phone')}</small></span><span class="customer-job"><strong>${esc(next?.title||(jobs.length?jobs.length+' recorded job'+(jobs.length===1?'':'s'):'No jobs'))}</strong><small>${esc(next?dateLabel(next.scheduledDate):(c.address||'Add job details'))}</small></span>${next?status(next.status):'<span></span>'}${icon('right')}</button>`}).join('')}</div>`:empty('users',state.query?'No customers match':'No customers yet',state.query?'Try a different search.':'Add your first customer and job to begin.',state.query?'':'<button class="secondary" data-go="new">Add customer</button>')}</div>`}

  function calendar(){const m=state.month,ym=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}`,monthJobs=state.data.jobs.filter(j=>j.scheduledDate?.startsWith(ym)).sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate)),label=m.toLocaleDateString(undefined,{month:'long',year:'numeric'}),days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),offset=new Date(m.getFullYear(),m.getMonth(),1).getDay();let cells=Array.from({length:offset},(_,i)=>`<div class="day blank" aria-hidden="true"></div>`).join('');for(let d=1;d<=days;d++){const ds=`${ym}-${String(d).padStart(2,'0')}`,items=monthJobs.filter(j=>j.scheduledDate===ds);cells+=`<div class="day"><span class="day-number">${d}</span>${items.map(j=>`<button class="calendar-job ${j.status}" data-open="${j.customerId}"><strong>${esc(customer(j.customerId)?.name||'Customer')}</strong><small>${esc(j.title)}</small></button>`).join('')}</div>`}return `<div class="page"><header class="calendar-head"><button class="icon-btn" id="prevMonth" aria-label="Previous month">${icon('left')}</button><div class="calendar-title"><span class="eyebrow">Jobs and appointments</span><h1>${esc(label)}</h1></div><button class="icon-btn" id="nextMonth" aria-label="Next month">${icon('right')}</button></header><div class="calendar-grid" aria-label="Calendar for ${esc(label)}"><div class="weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<span>${d}</span>`).join('')}</div><div class="days-grid">${cells}</div></div><div class="mobile-agenda">${sectionHead(label,monthJobs.length+' scheduled item'+(monthJobs.length===1?'':'s'))}${monthJobs.length?`<div class="job-rows">${monthJobs.map(j=>`<button class="job-row" data-open="${j.customerId}"><time>${dateLabel(j.scheduledDate,true)}</time><span class="job-main"><strong>${esc(customer(j.customerId)?.name||'Customer')}</strong><small>${esc(j.title)}</small></span>${status(j.status)}</button>`).join('')}</div>`:empty('calendar','No jobs this month','Use the arrows to check another month.')}</div><div class="legend">${Object.entries(STATUS).map(([k,v])=>`<span><i class="${k}"></i>${v}</span>`).join('')}</div></div>`}
  function bindCalendar(){document.getElementById('prevMonth').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()};document.getElementById('nextMonth').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()}}
  function notes(){return `<div class="page notes-page"><header class="page-intro compact"><div><span class="eyebrow">Additional information</span><h1>Notes</h1><p>Jobsite reminders, calls, measurements, and materials.</p></div><button class="primary" id="saveNotes">Keep in session</button></header><textarea class="lined-notes" id="notesText" aria-label="Business notes" placeholder="Materials to order, calls to return, measurements, reminders…">${esc(state.data.businessNotes)}</textarea><div class="mountain-rule"><span>Building a better tomorrow.</span></div></div>`}

  function guide(){const steps=[['1','Add the customer and first job','Enter contact details, the project, estimate, date, and status.'],['2','Work from one record','Customer details, job notes, photos, and status stay together.'],['3','Check the calendar','Scheduled work appears automatically in the correct month.'],['4','Download a backup','Save a JSON backup before closing. Load it the next time you open the app.']];return `<div class="page"><header class="page-intro compact"><div><span class="eyebrow">Simple four-step process</span><h1>How it works</h1><p>A practical offline workflow from first call through completed work.</p></div></header><div class="guide-layout"><div class="steps">${steps.map(s=>`<div class="step"><span>${s[0]}</span><div><h2>${s[1]}</h2><p>${s[2]}</p></div></div>`).join('')}</div><aside class="tips"><h2>Best results</h2><ul><li>Use clear project titles.</li><li>Add photos when they explain the work.</li><li>Keep dates and statuses current.</li><li>Back up after every work session.</li></ul><button class="gold-btn" data-go="new">Add a customer / job</button></aside></div></div>`}
  function detail(){const c=customer(state.selected);if(!c)return `<div class="page">${empty('users','Customer not found','That customer may have been removed.','<button class="primary" data-go="customers">Back to customers</button>')}</div>`;const jobs=jobsFor(c.id),photos=photosFor(c.id);return `<div class="page"><header class="detail-head"><button class="back-btn" data-go="customers">${icon('left')}Customers</button><span>Customer ID: ${String(state.data.customers.indexOf(c)+1).padStart(3,'0')}</span></header><div class="detail-grid"><div class="detail-main"><section class="detail-section">${sectionHead('Customer information','',state.editingCustomer?'':'<button class="text-btn" id="editCustomer">'+icon('edit')+'Edit</button>')}${state.editingCustomer?customerEditor(c):`<dl class="customer-facts"><div><dt>Name</dt><dd>${esc(c.name)}</dd></div><div><dt>Phone</dt><dd>${esc(c.phone||'—')}</dd></div><div><dt>Email</dt><dd>${esc(c.email||'—')}</dd></div><div><dt>Address</dt><dd>${esc(c.address||'—')}</dd></div></dl>`}</section><section class="detail-section">${sectionHead('Jobs / projects',jobs.length+' record'+(jobs.length===1?'':'s'),'<button class="secondary small" id="addJob">'+icon('plus')+'Add job</button>')}${state.showJobForm?jobEditor(c.id,state.editingJob):''}${jobs.length?`<div class="job-detail-list">${jobs.map(j=>`<article class="job-detail"><div class="job-title"><div><h3>${esc(j.title)}</h3><p>${esc(dateLabel(j.scheduledDate))}</p></div>${status(j.status)}</div>${j.description?`<div><h4>Description</h4><p>${esc(j.description)}</p></div>`:''}${j.materials?`<div><h4>Materials / special instructions</h4><p>${esc(j.materials)}</p></div>`:''}<div class="job-bottom"><strong>${money(j.estimate)}</strong><span class="inline-actions"><button class="text-btn edit-job" data-id="${j.id}">${icon('edit')}Edit</button><button class="danger-link delete-job" data-id="${j.id}">${icon('trash')}Delete</button></span></div>${state.confirmJob===j.id?`<div class="confirm-box"   function bindDetail(){const c=customer(state.selected);if(!c)return;const ec=document.getElementById('editCustomer');if(ec)ec.onclick=()=>{state.editingCustomer=true;render()};const ce=document.getElementById('customerEditor');if(ce)ce.onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);c.name=String(f.get('name')).trim();c.phone=String(f.get('phone')).trim();c.email=String(f.get('email')).trim();c.address=String(f.get('address')).trim();state.editingCustomer=false;setDirty();toast('Customer updated');render()};const cc=document.getElementById('cancelCustomerEdit');if(cc)cc.onclick=()=>{state.editingCustomer=false;render()};document.getElementById('addJob').onclick=()=>{state.editingJob=null;state.showJobForm=true;render()};document.querySelectorAll('.edit-job').forEach(b=>b.onclick=()=>{state.editingJob=state.data.jobs.find(j=>j.id===Number(b.dataset.id));state.showJobForm=true;render()});document.querySelectorAll('.delete-job').forEach(b=>b.onclick=()=>{state.confirmJob=Number(b.dataset.id);render()});document.querySelectorAll('.keep-job').forEach(b=>b.onclick=()=>{state.confirmJob=null;render()});document.querySelectorAll('.confirm-job').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.id);state.data.jobs=state.data.jobs.filter(j=>j.id!==id);state.confirmJob=null;setDirty();toast('Job deleted');render()});const je=document.getElementById('jobEditor');if(je)je.onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),obj={title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),materials:String(f.get('materials')).trim(),estimate:Number(f.get('estimate')||0),scheduledDate:String(f.get('scheduledDate')||''),status:String(f.get('status'))};if(state.editingJob)Object.assign(state.editingJob,obj);else state.data.jobs.push({id:uid(),customerId:c.id,...obj});state.editingJob=null;state.showJobForm=false;setDirty();toast('Job saved');render()};const cj=document.getElementById('cancelJob');if(cj)cj.onclick=()=>{state.editingJob=null;state.showJobForm=false;render()};document.getElementById('deleteCustomer').onclick=()=>{state.confirmDelete=true;render()};const keep=document.getElementById('keepCustomer');if(keep)keep.onclick=()=>{state.confirmDelete=false;render()};const conf=document.getElementById('confirmCustomer');if(conf)conf.onclick=()=>{state.data.customers=state.data.customers.filter(x=>x.id!==c.id);state.data.jobs=state.data.jobs.filter(x=>x.customerId!==c.id);state.data.photos=state.data.photos.filter(x=>x.customerId!==c.id);setDirty();toast('Customer deleted');go('customers')};const pi=document.getElementById('photoInput');if(pi)pi.onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){toast('Choose an image under 5 MB');return}const r=new FileReader();r.onload=()=>{state.data.photos.push({id:uid(),customerId:c.id,data:String(r.result),name:file.name});setDirty();toast('Photo added');render()};r.readAsDataURL(file)};document.querySelectorAll('.delete-photo').forEach(b=>b.onclick=()=>{state.data.photos=state.data.photos.filter(p=>p.id!==Number(b.dataset.id));setDirty();toast('Photo deleted');render()})}
  function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  function downloadBackup(){if(state.view==='notes'){const n=document.getElementById('notesText');if(n)state.data.businessNotes=n.value}download(`scheduler-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({...state.data,exportedAt:new Date().toISOString()},null,2),'application/json');state.dirty=false;toast('Backup downloaded')}
  function downloadApp(){const html='<!doctype html>\n'+document.documentElement.outerHTML;download('white-mountain-scheduler.html',html,'text/html');toast('App file downloaded')}
  function loadBackup(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result));if(!Array.isArray(d.customers)||!Array.isArray(d.jobs)||!Array.isArray(d.photos))throw new Error();state.data={version:1,businessNotes:String(d.businessNotes||''),customers:d.customers,jobs:d.jobs,photos:d.photos};saveLocal();state.dirty=false;state.selected=null;state.view='dashboard';toast('Backup loaded');render()}catch{toast('That file is not a valid scheduler backup')}};r.readAsText(file);e.target.value=''}
  window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue=''}});
  const restored=restoreLocal();
  render();
  if(restored)toast('Autosaved work restored');
})();
</script>
</body>
</html>
